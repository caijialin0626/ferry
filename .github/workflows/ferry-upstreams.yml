name: Request quota dialog review
on: workflow_dispatch
permissions: {}
jobs:
  review:
    if: github.ref == 'refs/heads/ferry/request-review-quota-scroll' && github.actor == 'caijialin0626'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the tested change for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          head=ferry/quota-scroll
          test "$(gh api "repos/$REPO/git/ref/heads/$head" --jq .object.sha)" = 79c1e2e9afa16746cb5fcbca3ddc9ac20748c4c0
          cat > "$RUNNER_TEMP/review.md" <<'BODY'
          Size the quota dialog content within its available height so only the results list scrolls. The close button, machine selector and refresh button stay in place.

          Checked long quota lists at mobile and desktop widths in Chromium and WebKit. The browser regression checks that the dialog has no vertical overflow and the last quota entry is reachable.
          BODY
          gh pr create -R "$REPO" --base main --head "$head" --title 'Keep one scrollbar in the account quota dialog' --body-file "$RUNNER_TEMP/review.md"
