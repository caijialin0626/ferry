name: Check upstream CLIs
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions: {}
jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        cli: [codex, claude, agy]
    permissions:
      actions: write
    steps:
      - name: Queue a compatibility check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          CLI: ${{ matrix.cli }}
        run: gh workflow run ferry-issues.yml -R "$REPO" --ref "$BRANCH" -f mode=upstream -f cli="$CLI"
