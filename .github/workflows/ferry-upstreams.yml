name: Request session history review
on: workflow_dispatch
permissions: {}
jobs:
  review:
    if: github.ref == 'refs/heads/ferry/request-review-f8134eb' && github.actor == 'caijialin0626'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the tested change for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          head=ferry/review-session-open-latency
          test "$(gh api "repos/$REPO/git/ref/heads/$head" --jq .object.sha)" = f8134eb9d031e9ab3348c2558f9f0c54d37c078d
          cat > "$RUNNER_TEMP/review.md" <<'BODY'
          A session could look empty when a connection dropped after HTTP 200. The client discarded the JSON decoding error, so the existing reconnect loop treated incomplete history as a successful read. A fixed timeout also interrupted healthy downloads on slower links.

          The client now propagates interrupted or incomplete successful responses and resets its read timeout as data arrives. Navigating away still cancels the active history request. The reconnect loop retries reads only.

          Verified in Chromium with a synthetic session whose first response was truncated and whose second response streamed for 16 seconds. The browser retried once, rendered the message and connected to the event stream. All 17 repository tests and the syntax checks passed on Linux with Node 22.

          Supersedes #10 with the same tested commit so the maintainer can review it.
          BODY
          gh pr create -R "$REPO" --base main --head "$head" --title 'Recover session history when a download stalls or disconnects' --body-file "$RUNNER_TEMP/review.md"
