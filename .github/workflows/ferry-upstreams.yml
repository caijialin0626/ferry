name: Request timeline progress review
on: workflow_dispatch
permissions: {}
jobs:
  review:
    if: github.ref == 'refs/heads/ferry/request-review-agy-timeline-063c4ae' && github.actor == 'caijialin0626'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the tested change for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          head=ferry/agy-timeline-progress
          test "$(gh api "repos/$REPO/git/ref/heads/$head" --jq .object.sha)" = 063c4ae9bbf22774e7dfb6f9337adaaa33fb7d31
          cat > "$RUNNER_TEMP/review.md" <<'BODY'
          Show the latest native Antigravity action summary above each consecutive group of tools. Later actions without a summary keep the most recent description visible. Commands and the full list remain available inside the disclosure.

          Verified with the Chromium browser regression using 105 actions and a final multiline command without a summary. The progress line stays visible with details collapsed during execution and after reopening a finished chat.
          BODY
          gh pr create -R "$REPO" --base main --head "$head" --title 'Show Antigravity progress in the chat timeline' --body-file "$RUNNER_TEMP/review.md"
