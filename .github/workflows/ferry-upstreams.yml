name: Request Antigravity image support review
on: workflow_dispatch
permissions: {}
jobs:
  review:
    if: github.ref == 'refs/heads/ferry/request-review-agy-images' && github.actor == 'caijialin0626'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the tested change for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          head=ferry/agy-images
          test "$(gh api "repos/$REPO/git/ref/heads/$head" --jq .object.sha)" = 62f0635b02e6debedd07c5bbbd17eaa3331659f3
          cat > "$RUNNER_TEMP/review.md" <<'BODY'
          Send image attachments to Antigravity as native ACP content blocks. Users can start a chat with images or add them to an existing conversation. Text-only turns continue to use the same native conversation through the print CLI.

          Verified image recognition and continuity on Antigravity 1.5.18 with synthetic images, including text-to-image and image-to-text transitions. The 18-test Node suite and the Chromium and WebKit upload and reload checks passed.
          BODY
          gh pr create -R "$REPO" --base main --head "$head" --title 'Support image attachments in Antigravity chats' --body-file "$RUNNER_TEMP/review.md"
